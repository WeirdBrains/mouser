name: Docs site
on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", "scripts/check-doc-sections.py", ".github/workflows/docs-site.yml" ]
  pull_request:
    paths: [ "docs/**" ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-site
  cancel-in-progress: false
jobs:
  check:
    name: every doc has a site section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-sections.py
  publish:
    name: rebuild the site with latest docs
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/checkout@v4
        with: { ref: site, path: site }
      - uses: dart-lang/setup-dart@v1
      - name: Sync static assets into the Jaspr web folder
        run: bash site/site_jaspr/tool/sync_web.sh
      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli
      - name: Get dependencies
        working-directory: site/site_jaspr
        run: dart pub get
      - name: Build static site
        working-directory: site/site_jaspr
        env:
          MOUSER_DOCS_DIR: ${{ github.workspace }}/main/docs
          MOUSER_SITE_SRC: ${{ github.workspace }}/site/site-src
        run: jaspr build --sitemap-domain https://mouser.weirdbrains.com
      - name: Strip build extras from the Pages artifact
        run: bash site/site_jaspr/tool/clean_artifact.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/site_jaspr/build/jaspr }
      - id: deployment
        uses: actions/deploy-pages@v4
