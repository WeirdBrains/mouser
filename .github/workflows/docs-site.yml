name: Docs site
on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "site_jaspr/**"
      - "site-src/**"
      - "site/assets/**"
      - "site/style.css"
      - "site/main.js"
      - "site/CNAME"
      - "scripts/check-doc-sections.py"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site_jaspr/**"
      - "site-src/**"
      - "site/assets/**"
      - "site/style.css"
      - "site/main.js"
      - "site/CNAME"
      - "scripts/check-doc-sections.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-site
  cancel-in-progress: false
jobs:
  check:
    name: every doc has a site section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-sections.py
  publish:
    name: rebuild the site with latest docs
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # site_jaspr's locked build_web_compilers needs SDK < 3.14 (3.14.0 broke
          # dart pub get on 2026-11-11); move with the pubspec.
          sdk: 3.13.7
      - name: Sync static assets into the Jaspr web folder
        run: bash site_jaspr/tool/sync_web.sh
      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli
      - name: Get dependencies
        working-directory: site_jaspr
        run: dart pub get
      - name: Build static site
        working-directory: site_jaspr
        env:
          MOUSER_DOCS_DIR: ${{ github.workspace }}/docs
          MOUSER_SITE_SRC: ${{ github.workspace }}/site-src
        run: jaspr build --sitemap-domain https://mouser.weirdbrains.com
      - name: Strip build extras from the Pages artifact
        run: bash site_jaspr/tool/clean_artifact.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site_jaspr/build/jaspr }
      - id: deployment
        uses: actions/deploy-pages@v4
