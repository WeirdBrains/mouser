name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    name: fmt + clippy + build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only GitHub-owned and verified actions are allowed in WeirdBrains.
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libasound2-dev libjack-jackd2-dev pkg-config cmake clang libclang-dev libvulkan-dev glslc spirv-headers ffmpeg mesa-vulkan-drivers libgl1-mesa-dri libegl1

      # ffmpeg for the player tests (the commander plugin's 60 fps shm path).
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ffmpeg -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> "$GITHUB_PATH"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --release

      - name: test
        env:
          MOUSER_REQUIRE_FFMPEG: "1"
          # Linux has a software adapter (lavapipe/llvmpipe): the wgpu engine
          # parity tests must run there; elsewhere they run when wgpu finds one.
          MOUSER_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace

      # JACK output is an optional feature (it needs the JACK headers to build).
      - name: clippy + audio tests with JACK (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p mouser-core -p mouser-render -p mouser-commander --features mouser-core/jack,mouser-render/jack,mouser-commander/jack --all-targets -- -D warnings
          cargo test -p mouser-core --features jack --lib audio
          cargo test -p mouser-commander --features jack --bin mouser-commander audio


      # The Windows build, for checking on a Windows machine without a release.
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mouser-windows-x86_64
          path: target/release/mouser-app.exe
          if-no-files-found: error
          retention-days: 14
