name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds every artifact but publishes nothing (a dry run).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # Only GitHub-owned and verified actions are allowed in WeirdBrains.
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libasound2-dev libjack-jackd2-dev pkg-config cmake clang libclang-dev libvulkan-dev spirv-headers patchelf desktop-file-utils appstream libxml2-utils

      # Linux builds on Ubuntu 22.04 (glibc 2.35) so the binary runs on older
      # distributions. 22.04 has no glslc package and old Vulkan headers, so
      # llama.cpp's Vulkan backend takes both from the LunarG SDK.
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vk.tar.xz" https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz
          mkdir -p "$RUNNER_TEMP/vk" && tar -xJf "$RUNNER_TEMP/vk.tar.xz" -C "$RUNNER_TEMP/vk"
          sdk=$(ls -d "$RUNNER_TEMP"/vk/*/x86_64 | head -1)
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "CPATH=$sdk/include" >> "$GITHUB_ENV"
          "$sdk/bin/glslc" --version

      - name: Build
        # Linux builds carry JACK output (libjack is loaded at run time).
        run: cargo build --release --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--features mouser-app/jack,mouser-commander/jack' || '' }}

      - name: Sign binaries (macOS, Windows; skipped without the signing secrets)
        if: runner.os != 'Linux'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -eu
          OUTDIR=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -z "${MACOS_CERT_P12}" ]; then echo "::notice::MACOS_CERT_P12 not set; macOS binaries are unsigned"; exit 0; fi
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$RUNNER_TEMP/sign.keychain"
            security default-keychain -s "$RUNNER_TEMP/sign.keychain"
            security unlock-keychain -p "" "$RUNNER_TEMP/sign.keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/sign.keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/sign.keychain"
            for f in "$OUTDIR/mouser-app" "$OUTDIR"/libmouser_engine_*.dylib; do
              codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$f"
            done
          else
            if [ -z "${WINDOWS_CERT_PFX}" ]; then echo "::notice::WINDOWS_CERT_PFX not set; Windows binaries are unsigned"; exit 0; fi
            echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            SIGNTOOL=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
            for f in "$OUTDIR/mouser-app.exe" "$OUTDIR"/mouser_engine_*.dll; do
              "$SIGNTOOL" sign /f "$RUNNER_TEMP/cert.pfx" /p "$WINDOWS_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$f"
            done
          fi

      - name: Package
        shell: bash
        run: |
          set -eux
          OUTDIR=target/${{ matrix.target }}/release
          NAME=mouser
          # For Linux/macOS, rename binary to 'mouser' in a staging dir
          if [ "${{ runner.os }}" != "Windows" ]; then
            install -Dm755 "$OUTDIR/${NAME}-app" "$OUTDIR/mouser"
          fi
          # Mouser's engines ship beside it in engines/<name>/ (docs/release.md).
          rm -rf "$OUTDIR/engines"
          "$OUTDIR/${NAME}-app" engine bundle --from "$OUTDIR" --out "$OUTDIR/engines"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ART=${NAME}-${{ matrix.target }}.zip
            (cd "$OUTDIR" && 7z a "$GITHUB_WORKSPACE/$ART" "${NAME}-app.exe" engines)
          else
            ART=${NAME}-${{ matrix.target }}.tar.gz
            tar -C "$OUTDIR" -czf "$ART" "${NAME}-app" engines
          fi
          echo "ARTIFACT=$ART" >> $GITHUB_ENV

      - name: Checksums (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactPath = Join-Path -Path $Env:GITHUB_WORKSPACE -ChildPath $Env:ARTIFACT
          $hash = (Get-FileHash -Algorithm SHA256 $artifactPath).Hash.ToLower()
          $hash | Out-File -FilePath "$artifactPath.sha256" -NoNewline -Encoding ASCII

      - name: Linux packaging (icons + validate + nfpm deb/rpm + Arch)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          VER="${VERSION#v}"
          # Validate desktop and AppStream
          desktop-file-validate resources/linux/mouser.desktop
          appstreamcli validate resources/linux/io.github.m3talsmith.mouser.metainfo.xml
          # nfpm: deb and rpm from prebuilt binary
          BINPATH="target/x86_64-unknown-linux-gnu/release/mouser"
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.37.0/nfpm_2.37.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm
          mkdir -p dist
          # render nfpm config with concrete paths and version
          # Replace literal tokens ${BINARY_PATH} and ${VERSION} without triggering shell expansion
          ENGPATH="target/x86_64-unknown-linux-gnu/release/engines"
          sed -e 's|${BINARY_PATH}|'$BINPATH'|g' -e 's|${ENGINES_PATH}|'$ENGPATH'|g' -e 's|${VERSION}|'$VER'|g' packaging/nfpm.yaml > packaging/nfpm.gen.yaml
          nfpm package --packager deb --config packaging/nfpm.gen.yaml --target "dist/mouser_${VER}_amd64.deb"
          nfpm package --packager rpm --config packaging/nfpm.gen.yaml --target "dist/mouser-${VER}-1.x86_64.rpm"
          # Arch package via container, from packaging/arch/mouser-bin/PKGBUILD with
          # this build's binary and source tree (the release does not exist yet).
          TARBALL="mouser-x86_64-unknown-linux-gnu.tar.gz"
          W=packaging/arch/work
          mkdir -p "$W"
          sed -e "s/^pkgver=.*/pkgver=${VER}/" -e "s/^sha256sums=.*/sha256sums=('SKIP')/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('SKIP')/" packaging/arch/mouser-bin/PKGBUILD > "$W/PKGBUILD"
          cp "$TARBALL" "$W/mouser-${VER}-x86_64-unknown-linux-gnu.tar.gz"
          git archive --prefix="mouser-${VER}/" -o "$W/mouser-src-${VER}.tar.gz" HEAD
          cat > "$W/buildpkg.sh" <<'EOS'
          set -eux
          pacman -Syu --noconfirm base-devel hicolor-icon-theme libxkbcommon wayland
          useradd -m builder
          chown -R builder:builder /work
          su - builder -c 'cd /work && makepkg -f --noconfirm --nodeps'
          EOS
          docker run --rm -v "$PWD/$W:/work" archlinux:base-devel bash /work/buildpkg.sh
          find "$W" -maxdepth 1 -name "mouser-bin-[0-9]*.pkg.tar.zst" -exec sudo mv {} dist/ \;
          # Checksums for packages
          (cd dist && for f in *.{deb,rpm,pkg.tar.zst}; do [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"; done)
          # Upload extra artifacts
          echo "EXTRA_DONE=1" >> $GITHUB_ENV
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sha256

      - name: macOS app bundle + dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eux
          VER="${VERSION#v}"
          # App bundle
          APPDIR="Mouser.app/Contents"
          mkdir -p "$APPDIR/MacOS" "$APPDIR/Resources"
          install -Dm755 "target/${{ matrix.target }}/release/mouser-app" "$APPDIR/MacOS/mouser"
          cp resources/macos/mouser.icns "$APPDIR/Resources/mouser.icns"
          cp -R "target/${{ matrix.target }}/release/engines" "$APPDIR/Resources/engines"
          cat > "$APPDIR/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Mouser</string>
            <key>CFBundleDisplayName</key><string>Mouser</string>
            <key>CFBundleIdentifier</key><string>io.github.m3talsmith.mouser</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>mouser</string>
            <key>CFBundleIconFile</key><string>mouser</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict></plist>
          PLIST
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" Mouser.app
          fi
          hdiutil create -fs HFS+ -volname "Mouser ${VER}" -srcfolder "Mouser.app" "Mouser-${{ matrix.target }}.dmg"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            xcrun notarytool submit "Mouser-${{ matrix.target }}.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "Mouser-${{ matrix.target }}.dmg"
          else
            echo "::notice::APPLE_ID or MACOS_SIGN_IDENTITY not set; the dmg is not signed or notarized"
          fi
          shasum -a 256 "Mouser-${{ matrix.target }}.dmg" > "Mouser-${{ matrix.target }}.dmg.sha256"
          echo "DMG_DONE=1" >> $GITHUB_ENV
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.target }}
          path: |
            Mouser-${{ matrix.target }}.dmg
            Mouser-${{ matrix.target }}.dmg.sha256

      - name: Windows installer (Inno Setup) and icon
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          choco install -y innosetup
          if (-Not (Test-Path resources/windows/mouser.ico)) { throw \"Missing resources/windows/mouser.ico\" }
          # Rename binary to mouser.exe for packaging
          Copy-Item "target/x86_64-pc-windows-msvc/release/mouser-app.exe" "target/x86_64-pc-windows-msvc/release/mouser.exe"
          $ver = $Env:VERSION.Substring(1)
          (Get-Content packaging/windows/installer.iss.tmpl).Replace("@VERSION@",$ver) | Set-Content packaging/windows/installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          if ($Env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $Env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($Env:WINDOWS_CERT_PFX))
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
            & $signtool sign /f $pfx /p $Env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\MouserSetup-$ver.exe"
          } else { Write-Output "::notice::WINDOWS_CERT_PFX not set; the installer is unsigned" }
          Get-FileHash -Algorithm SHA256 "dist\MouserSetup-$ver.exe" | ForEach-Object { $_.Hash.ToLower() } | Out-File -FilePath "dist\MouserSetup-$ver.exe.sha256" -NoNewline -Encoding ASCII
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/MouserSetup-*.exe
            dist/MouserSetup-*.exe.sha256
 
      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  publish:
    name: Publish GitHub Release
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Retry artifact download via gh (best-effort)
        run: gh run download ${{ github.run_id }} -D dist || true

      - name: Extract notes from CHANGELOG
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          awk -v ver="## [$VER]" 'f{print} $0 ~ ver{f=1}' CHANGELOG.md | awk 'NR==1 || /^## \[/{print; if(NR>1) exit}' > notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: minisign the release files (skipped without MINISIGN_SECRET_KEY)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then echo "::notice::MINISIGN_SECRET_KEY not set; release files are not minisigned"; exit 0; fi
          curl -sSfL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          MS=$(find "$RUNNER_TEMP" -type f -name minisign -path '*x86_64*' | head -1)
          echo "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          find dist -type f ! -name '*.sha256' ! -name '*.minisig' | while read -r f; do
            echo "$MINISIGN_PASSWORD" | "$MS" -S -s "$RUNNER_TEMP/minisign.key" -m "$f"
          done
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # One file per name (artifacts can be downloaded twice).
          mkdir -p upload
          find dist -type f -exec cp -n {} upload/ \;
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md upload/*

      - name: Generate Homebrew formula and cask and push to repo
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          VER="${VERSION#v}"
          cd "${GITHUB_WORKSPACE}"
          # Ensure we're based on the latest main, not the detached tag checkout
          git fetch origin main
          git checkout -B main origin/main
          LINUX_TGZ="dist/mouser-x86_64-unknown-linux-gnu.tar.gz"
          MAC_TGZ_AMD="dist/mouser-x86_64-apple-darwin.tar.gz"
          MAC_TGZ_ARM="dist/mouser-aarch64-apple-darwin.tar.gz"
          DMG_AMD="dist/Mouser-x86_64-apple-darwin.dmg"
          DMG_ARM="dist/Mouser-aarch64-apple-darwin.dmg"
          SHA_AMD=$(shasum -a 256 "$MAC_TGZ_AMD" | awk '{print $1}')
          SHA_ARM=$(shasum -a 256 "$MAC_TGZ_ARM" | awk '{print $1}')
          CSK_AMD=$(shasum -a 256 "$DMG_AMD" | awk '{print $1}')
          CSK_ARM=$(shasum -a 256 "$DMG_ARM" | awk '{print $1}')
          mkdir -p Formula Casks
          cat > Formula/mouser.rb <<'RUBY'
          class Mouser < Formula
            desc "Mouser terminal emulator"
            homepage "https://github.com/WeirdBrains/mouser"
            version "@VER@"
            on_macos do
              on_arm do
                url "https://github.com/WeirdBrains/mouser/releases/download/v@VER@/mouser-aarch64-apple-darwin.tar.gz"
                sha256 "@SHA_ARM@"
              end
              on_intel do
                url "https://github.com/WeirdBrains/mouser/releases/download/v@VER@/mouser-x86_64-apple-darwin.tar.gz"
                sha256 "@SHA_AMD@"
              end
            end
            def install
              bin.install "mouser-app" => "mouser"
              (lib/"mouser").install "engines"
            end
          end
          RUBY
          sed -i.bak -e "s/@VER@/${VER}/g" -e "s/@SHA_ARM@/${SHA_ARM}/g" -e "s/@SHA_AMD@/${SHA_AMD}/g" Formula/mouser.rb
          cat > Casks/mouser.rb <<'RUBY'
          cask "mouser" do
            version "@VER@"
            on_arm do
              sha256 "@CSK_ARM@"
              url "https://github.com/WeirdBrains/mouser/releases/download/v@VER@/Mouser-aarch64-apple-darwin.dmg"
            end
            on_intel do
              sha256 "@CSK_AMD@"
              url "https://github.com/WeirdBrains/mouser/releases/download/v@VER@/Mouser-x86_64-apple-darwin.dmg"
            end
            name "Mouser"
            desc "Mouser terminal emulator"
            homepage "https://github.com/WeirdBrains/mouser"
            auto_updates false
            app "Mouser.app"
          end
          RUBY
          sed -i.bak -e "s/@VER@/${VER}/g" -e "s/@CSK_ARM@/${CSK_ARM}/g" -e "s/@CSK_AMD@/${CSK_AMD}/g" Casks/mouser.rb
          git config user.email "cursoragent@cursor.com"
          git config user.name "Cursor Agent"
          # AUR-ready mouser-bin PKGBUILD + .SRCINFO with the published checksums.
          packaging/arch/update-bin.sh "${VER}"
          git add Formula/mouser.rb Casks/mouser.rb packaging/arch/mouser-bin/PKGBUILD packaging/arch/mouser-bin/.SRCINFO
          git commit -m "packaging: update brew formula, cask and mouser-bin PKGBUILD for v${VER}" || true
          git push origin HEAD:main

