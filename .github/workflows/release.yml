name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev pkg-config patchelf desktop-file-utils appstream libxml2-utils

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eux
          OUTDIR=target/${{ matrix.target }}/release
          NAME=mouser
          # For Linux/macOS, rename binary to 'mouser' in a staging dir
          if [ "${{ runner.os }}" != "Windows" ]; then
            install -Dm755 "$OUTDIR/${NAME}-app" "$OUTDIR/mouser"
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ART=${NAME}-${{ matrix.target }}.zip
            7z a "$ART" "$OUTDIR/${NAME}-app.exe"
          else
            ART=${NAME}-${{ matrix.target }}.tar.gz
            tar -C "$OUTDIR" -czf "$ART" "${NAME}-app"
          fi
          echo "ARTIFACT=$ART" >> $GITHUB_ENV

      - name: Checksums (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactPath = Join-Path -Path $Env:GITHUB_WORKSPACE -ChildPath $Env:ARTIFACT
          $hash = (Get-FileHash -Algorithm SHA256 $artifactPath).Hash.ToLower()
          $hash | Out-File -FilePath "$artifactPath.sha256" -NoNewline -Encoding ASCII

      - name: Linux packaging (icons + validate + nfpm deb/rpm + Arch)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          VER="${VERSION#v}"
          # Validate desktop and AppStream
          desktop-file-validate resources/linux/mouser.desktop
          appstreamcli validate resources/linux/io.github.m3talsmith.mouser.metainfo.xml
          # nfpm: deb and rpm from prebuilt binary
          BINPATH="target/x86_64-unknown-linux-gnu/release/mouser"
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.37.0/nfpm_2.37.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm
          mkdir -p dist
          # render nfpm config with concrete paths and version
          # Replace literal tokens ${BINARY_PATH} and ${VERSION} without triggering shell expansion
          sed -e 's|${BINARY_PATH}|'$BINPATH'|g' -e 's|${VERSION}|'$VER'|g' packaging/nfpm.yaml > packaging/nfpm.gen.yaml
          nfpm package --packager deb --config packaging/nfpm.gen.yaml --target "dist/mouser_${VER}_amd64.deb"
          nfpm package --packager rpm --config packaging/nfpm.gen.yaml --target "dist/mouser-${VER}-1.x86_64.rpm"
          # Arch package via container
          TARBALL="mouser-x86_64-unknown-linux-gnu.tar.gz"
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          mkdir -p packaging/arch/work
          sed "s/@VERSION@/${VER}/g; s/@SHA256@/${SHA}/g" packaging/arch/PKGBUILD.tmpl > packaging/arch/work/PKGBUILD
          cp "$TARBALL" packaging/arch/work/
          cp -r resources packaging/arch/work/
          mkdir -p packaging/arch/work/build/icons/hicolor
          cp -r resources/icons/hicolor/* packaging/arch/work/build/icons/hicolor/
          cat > packaging/arch/work/buildpkg.sh <<'EOS'
          set -eux
          pacman -Syu --noconfirm base-devel hicolor-icon-theme
          useradd -m builder
          chown -R builder:builder /work
          # Build without attempting to resolve deps (installed above as root)
          su - builder -c 'cd /work && makepkg -f --noconfirm --nodeps'
          EOS
          docker run --rm -v "$PWD/packaging/arch/work:/work" archlinux:base-devel bash /work/buildpkg.sh
          # Move built package
          find packaging/arch/work -maxdepth 1 -name "*.pkg.tar.zst" -exec sudo mv {} dist/ \;
          # Checksums for packages
          (cd dist && for f in *.{deb,rpm,pkg.tar.zst}; do [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"; done)
          # Upload extra artifacts
          echo "EXTRA_DONE=1" >> $GITHUB_ENV
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sha256

      - name: macOS app bundle + dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          VER="${VERSION#v}"
          # App bundle
          APPDIR="Mouser.app/Contents"
          mkdir -p "$APPDIR/MacOS" "$APPDIR/Resources"
          install -Dm755 "target/${{ matrix.target }}/release/mouser-app" "$APPDIR/MacOS/mouser"
          cp resources/macos/mouser.icns "$APPDIR/Resources/mouser.icns"
          cat > "$APPDIR/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Mouser</string>
            <key>CFBundleDisplayName</key><string>Mouser</string>
            <key>CFBundleIdentifier</key><string>io.github.m3talsmith.mouser</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>mouser</string>
            <key>CFBundleIconFile</key><string>mouser</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict></plist>
          PLIST
          hdiutil create -fs HFS+ -volname "Mouser ${VER}" -srcfolder "Mouser.app" "Mouser-${{ matrix.target }}.dmg"
          shasum -a 256 "Mouser-${{ matrix.target }}.dmg" > "Mouser-${{ matrix.target }}.dmg.sha256"
          echo "DMG_DONE=1" >> $GITHUB_ENV
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.target }}
          path: |
            Mouser-${{ matrix.target }}.dmg
            Mouser-${{ matrix.target }}.dmg.sha256

      - name: Windows installer (Inno Setup) and icon
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          choco install -y innosetup
          if (-Not (Test-Path resources/windows/mouser.ico)) { throw \"Missing resources/windows/mouser.ico\" }
          # Rename binary to mouser.exe for packaging
          Copy-Item "target/x86_64-pc-windows-msvc/release/mouser-app.exe" "target/x86_64-pc-windows-msvc/release/mouser.exe"
          $ver = $Env:VERSION.Substring(1)
          (Get-Content packaging/windows/installer.iss.tmpl).Replace("@VERSION@",$ver) | Set-Content packaging/windows/installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          Get-FileHash -Algorithm SHA256 "dist\MouserSetup-$ver.exe" | ForEach-Object { $_.Hash.ToLower() } | Out-File -FilePath "dist\MouserSetup-$ver.exe.sha256" -NoNewline -Encoding ASCII
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/MouserSetup-*.exe
            dist/MouserSetup-*.exe.sha256
 
      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  publish:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract notes from CHANGELOG
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          awk -v ver="## [$VER]" 'f{print} $0 ~ ver{f=1}' CHANGELOG.md | awk 'NR==1 || /^## \[/{print; if(NR>1) exit}' > notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew formula and cask and push to repo
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          VER="${VERSION#v}"
          cd "${GITHUB_WORKSPACE}"
          # Ensure we're based on the latest main, not the detached tag checkout
          git fetch origin main
          git checkout -B main origin/main
          LINUX_TGZ="dist/mouser-x86_64-unknown-linux-gnu.tar.gz"
          MAC_TGZ_AMD="dist/mouser-x86_64-apple-darwin.tar.gz"
          MAC_TGZ_ARM="dist/mouser-aarch64-apple-darwin.tar.gz"
          DMG_AMD="dist/Mouser-x86_64-apple-darwin.dmg"
          DMG_ARM="dist/Mouser-aarch64-apple-darwin.dmg"
          SHA_AMD=$(shasum -a 256 "$MAC_TGZ_AMD" | awk '{print $1}')
          SHA_ARM=$(shasum -a 256 "$MAC_TGZ_ARM" | awk '{print $1}')
          CSK_AMD=$(shasum -a 256 "$DMG_AMD" | awk '{print $1}')
          CSK_ARM=$(shasum -a 256 "$DMG_ARM" | awk '{print $1}')
          mkdir -p Formula Casks
          cat > Formula/mouser.rb <<'RUBY'
          class Mouser < Formula
            desc "Mouser terminal emulator"
            homepage "https://github.com/m3talsmith/mouser"
            version "@VER@"
            on_macos do
              on_arm do
                url "https://github.com/m3talsmith/mouser/releases/download/v@VER@/mouser-aarch64-apple-darwin.tar.gz"
                sha256 "@SHA_ARM@"
              end
              on_intel do
                url "https://github.com/m3talsmith/mouser/releases/download/v@VER@/mouser-x86_64-apple-darwin.tar.gz"
                sha256 "@SHA_AMD@"
              end
            end
            def install
              bin.install "mouser-app" => "mouser"
            end
          end
          RUBY
          sed -i.bak -e "s/@VER@/${VER}/g" -e "s/@SHA_ARM@/${SHA_ARM}/g" -e "s/@SHA_AMD@/${SHA_AMD}/g" Formula/mouser.rb
          cat > Casks/mouser.rb <<'RUBY'
          cask "mouser" do
            version "@VER@"
            on_arm do
              sha256 "@CSK_ARM@"
              url "https://github.com/m3talsmith/mouser/releases/download/v@VER@/Mouser-aarch64-apple-darwin.dmg"
            end
            on_intel do
              sha256 "@CSK_AMD@"
              url "https://github.com/m3talsmith/mouser/releases/download/v@VER@/Mouser-x86_64-apple-darwin.dmg"
            end
            name "Mouser"
            desc "Mouser terminal emulator"
            homepage "https://github.com/m3talsmith/mouser"
            auto_updates false
            app "Mouser.app"
          end
          RUBY
          sed -i.bak -e "s/@VER@/${VER}/g" -e "s/@CSK_ARM@/${CSK_ARM}/g" -e "s/@CSK_AMD@/${CSK_AMD}/g" Casks/mouser.rb
          git config user.email "cursoragent@cursor.com"
          git config user.name "Cursor Agent"
          git add Formula/mouser.rb Casks/mouser.rb
          git commit -m "brew: update formula and cask for v${VER}" || true
          git push origin HEAD:main

