name: mouser
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Mouser Contributors <noreply@example.com>
description: |
  Mouser terminal emulator with chunk-compressed scrollback and Kitty protocol.
homepage: https://github.com/WeirdBrains/mouser
license: BSD-3-Clause
depends:
  - libasound2
  - libvulkan1
recommends:
  - fonts-noto-color-emoji
overrides:
  rpm:
    depends:
      - alsa-lib
      - vulkan-loader
    recommends:
      - google-noto-color-emoji-fonts
contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/mouser
    type: file
    file_info:
      mode: 0755
  - src: ${ENGINES_PATH}
    dst: /usr/lib/mouser/engines
    type: tree
  - src: resources/linux/mouser.desktop
    dst: /usr/share/applications/mouser.desktop
  - src: resources/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: resources/icons/mouser.svg
    dst: /usr/share/icons/hicolor/scalable/apps/mouser.svg
  - src: resources/linux/io.github.m3talsmith.mouser.metainfo.xml
    dst: /usr/share/metainfo/io.github.m3talsmith.mouser.metainfo.xml
rpm:
  summary: Mouser terminal emulator


