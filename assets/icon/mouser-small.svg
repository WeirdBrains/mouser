<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04192A"/>
      <stop offset="100%" stop-color="#020F1B"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Simplified mouse silhouette for small sizes (clear at 16-32px) -->
  <!-- Body + head -->
  <path d="M28,72 C28,56 44,44 64,42 C80,40 98,46 108,56 C114,62 114,70 108,76 C98,86 80,92 64,94 C44,96 28,88 28,72 Z"
        fill="#2698A7"/>
  <!-- Pointed snout -->
  <path d="M108,64 L118,60 L108,68 Z" fill="#2698A7"/>
  <!-- Ear -->
  <circle cx="84" cy="54" r="10" fill="#94F3F2"/>
  <!-- Eye -->
  <circle cx="100" cy="62" r="2" fill="#E6FBFA"/>
  <!-- Whiskers -->
  <g stroke="#E6FBFA" stroke-width="2" stroke-linecap="round">
    <path d="M108,60 L118,58"/>
    <path d="M108,64 L118,64"/>
    <path d="M108,68 L118,70"/>
  </g>
  <!-- Feet -->
  <g stroke="#44B9C1" stroke-width="3" stroke-linecap="round">
    <path d="M46,96 C48,98 52,98 54,96"/>
    <path d="M60,98 C62,100 66,100 68,98"/>
  </g>
  <!-- Tail (connected curve) -->
  <path d="M80,86 C92,90 104,98 104,106 C104,110 100,114 96,114" fill="none" stroke="#2FD8E5" stroke-width="3" stroke-linecap="round"/>
</svg>

