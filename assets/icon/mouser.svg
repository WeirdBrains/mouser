    <!-- nose -->
    <circle cx="640" cy="356" r="10" fill="#2FD8E5"/>
    <!-- tail -->
    <path d="M620,460 C720,520 760,600 760,660 C760,708 724,740 680,740 C628,740 602,696 624,664 C640,640 676,644 692,664" fill="none" stroke="#44B9C1" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- Terminal prompt motif inside the body -->
  <g transform="translate(260,392)">
    <rect x="0" y="0" width="440" height="200" rx="20" ry="20" fill="#062639" opacity="0.65"/>
    <g transform="translate(28,64)" fill="#E6FBFA">
