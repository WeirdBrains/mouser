<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04192A"/>
      <stop offset="100%" stop-color="#020F1B"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94F3F2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2FD8E5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Mouse silhouette in profile: body/head as single shape -->
  <g transform="translate(140,200)">
    <!-- Tail connected to body -->
    <path d="M520,420 C630,470 700,540 700,610 C700,650 672,680 632,680 C602,680 582,662 584,640"
          fill="none" stroke="#2FD8E5" stroke-width="22" stroke-linecap="round"/>

    <!-- Body with head -->
    <path d="M140,360
             C140,250 230,170 360,156
             C460,146 560,176 630,230
             C690,276 720,338 700,392
             C680,446 612,492 512,520
             C394,552 264,538 192,500
             C156,480 140,430 140,392 Z"
          fill="#2698A7"/>

    <!-- Ear attached (overlapping) -->
    <ellipse cx="540" cy="250" rx="64" ry="80" fill="url(#ear)"/>

    <!-- Nose -->
    <circle cx="700" cy="380" r="10" fill="#E6FBFA"/>

    <!-- Integrated prompt >_ on the body near head -->
    <g transform="translate(420,330)">
      <path d="M0,0 L56,32 L0,64" stroke="#E6FBFA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="76" y="22" width="120" height="16" rx="8" fill="#2FD8E5"/>
    </g>
  </g>
</svg>

