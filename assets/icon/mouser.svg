  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bg)"/>
  <!-- Stylized mouse silhouette -->
  <g transform="translate(192,180)" fill="#2698A7">
    <!-- body -->
    <path d="M260,128 C356,60 520,64 600,160 C660,232 640,336 584,404 C520,480 412,520 320,528 C208,536 104,500 56,436 C24,394 16,336 44,292 C82,232 152,196 212,184 C232,180 246,170 260,128 Z" fill="#c0caf5"/>
    <!-- ear -->
