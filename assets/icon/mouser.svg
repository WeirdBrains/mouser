<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04192A"/>
      <stop offset="100%" stop-color="#020F1B"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94F3F2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2FD8E5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Mouse silhouette in profile: side view with pointed snout, big ear, eye, whiskers, feet, connected tail -->
  <g transform="translate(120,180)">
    <!-- Tail (connected) -->
    <path d="M520,460 C640,520 730,600 730,670 C730,710 700,740 660,740 C620,740 598,720 600,698"
          fill="none" stroke="#2FD8E5" stroke-width="22" stroke-linecap="round"/>

    <!-- Body + head silhouette -->
    <path d="M160,400
             C160,290 260,210 390,195
             C470,186 560,210 630,255
             C690,295 720,340 710,385
             C700,430 650,470 560,500
             C420,548 260,530 200,490
             C172,472 160,438 160,400 Z"
          fill="#2698A7"/>

    <!-- Pointed snout extension (attached to head) -->
    <path d="M700,380 L740,370 L700,390 Z" fill="#2698A7"/>

    <!-- Large round ear -->
    <circle cx="560" cy="270" r="78" fill="url(#ear)"/>

    <!-- Eye -->
    <circle cx="640" cy="340" r="10" fill="#E6FBFA"/>

    <!-- Nose (tiny highlight) -->
    <circle cx="742" cy="372" r="8" fill="#94F3F2"/>

    <!-- Whiskers -->
    <g stroke="#E6FBFA" stroke-width="8" stroke-linecap="round">
      <path d="M705,360 L760,350"/>
      <path d="M705,372 L760,372"/>
      <path d="M705,384 L760,394"/>
    </g>

    <!-- Small feet -->
    <g stroke="#44B9C1" stroke-width="12" stroke-linecap="round">
      <path d="M260,540 C270,550 290,550 300,540"/>
      <path d="M340,550 C350,560 370,560 380,550"/>
    </g>

    <!-- Optional subtle '>_' on body (kept small for legibility) -->
    <g transform="translate(430,410) scale(0.9)">
      <path d="M0,0 L52,30 L0,60" stroke="#E6FBFA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="70" y="20" width="110" height="14" rx="7" fill="#2FD8E5"/>
    </g>
  </g>
</svg>

