# Which website section each docs/*.md page belongs to.
# Sections: user, developer, mcp, api, internal, index.
# - user / developer / mcp / api: public pages on mouser.weirdbrains.com
# - internal: maintainer/agent docs kept in the repo only (not on the site)
# - index: docs/README.md (not a page)
# docs/historical/ is published under the archive.
# Checked by scripts/check-doc-sections.py; the Docs site workflow skips internal.
[docs]
"README.md" = "index"
"cli.md" = "user"
"help.md" = "user"
"terminal.md" = "user"
"modes.md" = "user"
"chat.md" = "user"
"markdown.md" = "user"
"connection-manager.md" = "user"
"ssh.md" = "user"
"themes.md" = "user"
"preferences.md" = "user"
"storage.md" = "user"
"rendering.md" = "user"
"models.md" = "user"
"downloads.md" = "user"
"windows.md" = "user"
"tabs.md" = "user"
"kitty-compliance.md" = "user"
"plugins.md" = "developer"
"mode-protocol.md" = "developer"
"building-modes.md" = "developer"
"host-views.md" = "developer"
"custom-engines.md" = "developer"
"fuzzball-integration.md" = "developer"
"mcp-from-plugins.md" = "developer"
"engines.md" = "developer"
"protocol/README.md" = "developer"
"mcp.md" = "mcp"
"deploy-mcp.md" = "mcp"
