# The commander mode as a plugin (docs/commander.md). It replaces the
# built-in commander mode when installed. It lists and previews files
# itself (thumbnails, Markdown, text) and plays media with ffmpeg/ffprobe,
# handing video frames to Mouser through shared memory.
# With remote.read it shows the remote shell's folder and previews its files
# over the session's own ssh connection, as the built-in mode does.
name = "commander"
version = "0.1.0"
description = "commander mode: the shell's folder as a list, grid or carousel above the prompt, with previews"
permissions = ["files.read", "files.write", "shell.type", "remote.read"]

[[provides]]
kind = "mode"

[run]
transport = "mode"
command = ["./mouser-commander"]

[mode]
hotkey = "c"
keys = [
  { id = "switch_view", key = "v", describe = "switch view (list / grid / carousel)" },
  { id = "search", key = "/", describe = "search this folder" },
  { id = "sync", key = "s", describe = "sync: move the shell to commander's folder (silently, at its next prompt if busy)" },
  { id = "up", key = "up", describe = "previous row" },
  { id = "down", key = "down", describe = "next row" },
  { id = "left", key = "left", describe = "previous item" },
  { id = "right", key = "right", describe = "next item" },
  { id = "open", key = "enter", describe = "open (folder: cd into it; file: full-width view)" },
  { id = "bigger", key = "z", describe = "larger grid tiles" },
  { id = "smaller", key = "x", describe = "smaller grid tiles" },
  { id = "hidden", key = "h", describe = "show / hide dotfiles (ls -a)" },
  { id = "options", key = "o", describe = "options window" },
  { id = "man", key = "m", describe = "manual for commander mode" },
  { id = "page_up", key = "pageup", describe = "page up" },
  { id = "page_down", key = "pagedown", describe = "page down" },
  { id = "first", key = "home", describe = "first item" },
  { id = "last", key = "end", describe = "last item" },
  { id = "parent", key = "u", describe = "back: where you came from, else the parent folder" },
  { id = "back", key = "backspace", describe = "back: where you came from, else the parent folder" },
  { id = "close", key = "q", describe = "close the file view / window" },
  { id = "mark", key = "space", describe = "mark / unmark the item (for pipe)" },
  { id = "mark_all", key = "*", describe = "mark all / clear marks" },
  { id = "pipe", key = "|", describe = "pipe the marked (or selected) paths into a command" },
  { id = "play_pause", key = "k", describe = "player: play / pause" },
  { id = "seek_back", key = "j", describe = "player: back 10 s" },
  { id = "seek_forward", key = "l", describe = "player: forward 10 s" },
  { id = "volume_down", key = "-", describe = "player: volume down" },
  { id = "volume_up", key = "=", describe = "player: volume up" },
  { id = "zoom_in", key = "=", describe = "image view: zoom in (same key as volume up in the player)" },
  { id = "zoom_out", key = "-", describe = "image view: zoom out (same key as volume down in the player)" },
  { id = "zoom_fit", key = "0", describe = "image view: fit" },
  { id = "zoom_actual", key = "1", describe = "image view: 100% (actual pixels)" },
  { id = "fullscreen", key = "f", describe = "image / player: fullscreen, the whole window; eases from the thumbnail (Esc or the same key leaves; appearance.reduce_motion skips the motion)" },
  { id = "menu", key = "i", describe = "header overflow menu (\u2022\u2022\u2022) when the window is narrow" },
  { id = "view_list", key = "L", describe = "list view" },
  { id = "view_grid", key = "G", describe = "grid view" },
  { id = "view_carousel", key = "C", describe = "carousel view" },
  { id = "open_fullscreen", key = "O", describe = "open: play / view fullscreen" },
  { id = "sync_item", key = "e", describe = "sync the shell into the selected folder" },
  { id = "copy", key = "y", describe = "copy the marked (or selected) items, to paste in another folder" },
  { id = "paste", key = "p", describe = "paste the copied items here (into the selected folder when on one)" },
  { id = "copy_to", key = "c", describe = "copy to\u2026 (asks where; Tab completes)" },
  { id = "move_to", key = "M", describe = "move to\u2026 (asks where; Tab completes)" },
  { id = "rename", key = "r", describe = "rename\u2026 (Tab completes)" },
  { id = "delete", key = "d", describe = "delete\u2026 (asks first)" },
  { id = "new_folder", key = "n", describe = "new folder\u2026 (Tab completes)" },
  { id = "copy_path", key = "Y", describe = "copy the path to the clipboard" },
  { id = "copy_text", key = "T", describe = "text view: copy the text" },
  { id = "sort_name", key = "N", describe = "sort by name" },
  { id = "sort_modified", key = "D", describe = "sort by modified (date)" },
  { id = "sort_size", key = "S", describe = "sort by size" },
  { id = "reverse", key = "R", describe = "reverse the order" },
  { id = "keys", key = "?", describe = "keyboard help: all keys and what they do" },
  { id = "help", key = "f1", describe = "keyboard help (same as ?)" },
]
