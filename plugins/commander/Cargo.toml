[package]
name = "mouser-commander"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mouser's commander mode as a plugin: the shell's folder above the prompt, with previews and the media player"
publish = false

[dependencies]
mouser-mode-api = { path = "../../crates/mouser-mode-api", features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs = "5.0.1"
once_cell.workspace = true
image.workspace = true
cpal = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
time.workspace = true

[dev-dependencies]
mouser-core = { path = "../../crates/mouser-core" }
mouser-render = { path = "../../crates/mouser-render" }
tempfile = "3.10.1"
serial_test = "3.0.0"

[lints]
workspace = true
