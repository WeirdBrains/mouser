[workspace]
members = [
  "crates/mouser-core",
  "crates/mouser-pty",
  "crates/mouser-render",
  "crates/mouser-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.4.1"
authors = ["Mouser Contributors"]
repository = ""
homepage = ""
readme = "README.md"

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"

[workspace.dependencies]
anyhow = "1.0.89"
thiserror = "1.0.63"
log = "0.4.22"
env_logger = "0.11.5"
crossbeam-channel = "0.5.13"
parking_lot = "0.12.3"
serde = { version = "1.0.210", features = ["derive"] }
toml = "0.8.19"
xdg = "2.5.2"
vte = "0.11.0"
regex = "1.11.1"
time = { version = "0.3.36", features = ["macros", "formatting"] }
instant = "0.1.13"
portable-pty = "0.8.1"
zstd = { version = "0.13.2", default-features = false, features = ["zstdmt"] }
lz4_flex = "0.11.3"
winit = "0.30.5"
wgpu = { version = "0.20.1", features = ["glsl"] }
glyphon = "0.6.0"
ab_glyph = "0.2.29"
palette = "0.7.6"
once_cell = "1.20.2"
bitflags = "2.6.0"
smol_str = "0.3.2"
serde_json = "1.0.128"
pollster = "0.3.0"
clap = { version = "4.5.7", features = ["derive"] }
clap_mangen = "0.2.20"

