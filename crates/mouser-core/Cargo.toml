[package]
name = "mouser-core"
edition = "2024"
version = "0.4.0"
license = "BSD-3-Clause"
description = "Terminal core for Mouser: grid, parser, scrollback with compression, and search"
repository = ""

[dependencies]
mouser-mode-api = { path = "../mouser-mode-api", features = ["markdown"] }
# The grok provider's opt-in Grok Bot desktop login (docs/models.md §grok).
grokbot_api = { version = "1.2", features = ["desktop-session"] }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
regex.workspace = true
vte.workspace = true
zstd.workspace = true
lz4_flex.workspace = true
time.workspace = true
instant.workspace = true
once_cell.workspace = true
bitflags.workspace = true
smol_str.workspace = true
palette.workspace = true
serde_json.workspace = true
toml.workspace = true
# Preferences mode: edit preferences.toml keeping comments and unknown keys.
toml_edit = "0.22"
# Markdown previews, chat replies and `mouser md` (docs/markdown.md).
dirs = "5.0.1"
hex = "0.4"
unicode-width = "0.1.14"
flate2 = "1"
png = { version = "0.17.16", default-features = false }
# MCP server (P2): TLS for the HTTPS option, self-signed certs, token in the OS keychain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
# Fuzzball wire format (encode/parse); terminal state stays in src/fuzzball.rs.
fuzzball = "1"
# MCP server Let's Encrypt certificates (ACME, pure Rust, ring + rustls, no OpenSSL).
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
webpki-roots = "1"
minijinja = { version = "3", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
# Plugin and engine downloads (docs/downloads.md): archives and minisign signatures.
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"] }

[dev-dependencies]
tempfile = "3.10.1"
# Sign test assets for the download tests.
minisign = "0.7"
serial_test = "3.0.0"
# mcp_acme tests: an in-memory ACME CA behind instant-acme's HttpClient.
http = "1"
bytes = "1"
http-body-util = "0.1"
# grok provider tests: encrypt a fake Grok Bot desktop session (Linux v10 Safe Storage).
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
pbkdf2 = { version = "0.13.0", default-features = false }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"
#[dev-dependencies]
env_logger.workspace = true
serde_json.workspace = true
regex.workspace = true


[target.'cfg(unix)'.dependencies]
libc = "0.2"
