[package]
name = "mouser-app"
edition = "2024"
version.workspace = true
license = "MIT"
description = "Mouser application binary"
repository = ""

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
crossbeam-channel.workspace = true
# `mouser show`: decoders for the formats it accepts (pure Rust).
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

mouser-core = { path = "../mouser-core" }
mouser-pty = { path = "../mouser-pty" }
mouser-render = { path = "../mouser-render" }

