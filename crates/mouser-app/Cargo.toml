[package]
name = "mouser-app"
edition = "2024"
version.workspace = true
license = "BSD-3-Clause"
description = "Mouser application binary"
repository = ""

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
clap_mangen = "0.2"
serde.workspace = true
toml.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
# `mouser show`: decoders for the formats it accepts (pure Rust).
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

mouser-core = { path = "../mouser-core" }
mouser-pty = { path = "../mouser-pty" }
mouser-render = { path = "../mouser-render" }
mouser-llm = { path = "../mouser-llm", optional = true }

[dev-dependencies]
tempfile = "3.10.1"
serial_test = "3.0.0"
serde_json.workspace = true
mouser-engine-abi = { path = "../mouser-engine-abi" }
# Mouser's own engine libraries, staged for the tests (tests/common).
mouser-engine-wgpu = { path = "../mouser-engine-wgpu" }
mouser-engine-skia = { path = "../mouser-engine-skia" }

[features]
# JACK output (docs/preferences.md §Audio); needs the JACK headers to build.
jack = ["mouser-render/jack"]
default = ["local-llm"]
# The built-in local model (llama.cpp with Vulkan, Metal on macOS); docs/models.md §Local.
# Build needs cmake, clang, and Vulkan headers + shaderc (Linux/Windows).
local-llm = ["dep:mouser-llm"]


[[example]]
name = "chat_live"
required-features = ["local-llm"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }
