[package]
name = "mouser-app"
edition = "2024"
version.workspace = true
license = "MIT"
description = "Mouser application binary"
repository = ""

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
# `mouser show`: decoders for the formats it accepts (pure Rust).
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

mouser-core = { path = "../mouser-core" }
mouser-pty = { path = "../mouser-pty" }
mouser-render = { path = "../mouser-render" }

[dev-dependencies]
tempfile = "3.10.1"
serial_test = "3.0.0"
serde_json.workspace = true
mouser-engine-abi = { path = "../mouser-engine-abi" }

[features]
# The Skia GPU engine (skia-safe downloads prebuilt Skia at build time).
default = ["skia"]
skia = ["mouser-render/skia"]

