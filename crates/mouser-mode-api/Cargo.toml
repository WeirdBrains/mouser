[package]
name = "mouser-mode-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Protocol, UI model and SDK for Mouser mode plugins (persistent child process, MessagePack over stdio, shared-memory images)"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
rmp-serde = "1.3"
memmap2 = "0.9"

[lints]
workspace = true

# A minimal mode plugin used by the tests and benchmarks: answers the
# handshake, keys and ticks (writing a frame into the ring, or inline).
[[bin]]
name = "mouser-mode-echo"
path = "src/bin/echo.rs"
