[package]
name = "mouser-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Media for Mouser mode plugins: the ffmpeg + cpal player, audio output, inline players with fullscreen and the open/close ease, shared by the commander and chat plugins"
publish = false

[dependencies]
mouser-mode-api = { path = "../mouser-mode-api", version = "0.3.0" }
mouser-views = { path = "../mouser-views", version = "0.1.0" }
serde_json.workspace = true
toml.workspace = true
dirs = "5.0.1"
cpal = "0.15"
image.workspace = true

[features]
# JACK output (docs/preferences.md §Audio); needs the JACK headers to build.
jack = ["cpal/jack"]

[dev-dependencies]
tempfile = "3.10.1"

[lints]
workspace = true
