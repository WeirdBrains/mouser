[package]
name = "mouser-render"
edition = "2024"
version = "0.4.0"
license = "MIT"
description = "GPU renderer and windowing for Mouser"
repository = ""

[dependencies]
anyhow.workspace = true
mouser-core = { path = "../mouser-core" }
log.workspace = true
winit.workspace = true
palette.workspace = true
crossbeam-channel.workspace = true
softbuffer = "0.4.6"
fontdb = "0.16.2"
fontdue = "0.7.3"
image.workspace = true
wgpu.workspace = true
pollster.workspace = true
mouser-engine-abi = { path = "../mouser-engine-abi" }
raw-window-handle = "0.6"
skia-safe = { version = "0.156.0", features = ["gl"], optional = true }
glutin = { version = "0.32.3", optional = true }
libloading = "0.9.0"
serde = { workspace = true, features = ["rc"] }
bincode = "1.3.3"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Wayland clipboard and primary selection as the focused client (no wl-copy needed).
smithay-clipboard = "0.7.3"

[features]
skia = ["dep:skia-safe", "dep:glutin"]

[dev-dependencies]
tempfile = "3.10.1"
mouser-engine-example = { path = "../mouser-engine-example" }
