[package]
name = "mouser-render"
edition = "2024"
version = "0.4.0"
license = "BSD-3-Clause"
description = "GPU renderer and windowing for Mouser"
repository = ""

[dependencies]
anyhow.workspace = true
mouser-core = { path = "../mouser-core" }
mouser-mode-api = { path = "../mouser-mode-api" }
log.workspace = true
winit.workspace = true
palette.workspace = true
crossbeam-channel.workspace = true
softbuffer = "0.4.6"
fontdb = "0.16.2"
fontdue = "0.7.3"
rustybuzz = "0.13.0"
# COLR v1 (Segoe UI Emoji on Windows 11) needs ttf-parser 0.21+; rustybuzz 0.13 bundles 0.20.
ttf-parser = "0.25"
tiny-skia = "0.11"
image.workspace = true
serde_json.workspace = true
cpal = "0.15"
mouser-engine-abi = { path = "../mouser-engine-abi" }
raw-window-handle = "0.6"
libloading = "0.9.0"
serde = { workspace = true, features = ["rc"] }
bincode = "1.3.3"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Wayland clipboard and primary selection as the focused client (no wl-copy needed).
smithay-clipboard = "0.7.3"

[dev-dependencies]
tempfile = "3.10.1"
mouser-engine-example = { path = "../mouser-engine-example" }
mouser-engine-wgpu = { path = "../mouser-engine-wgpu" }
mouser-engine-skia = { path = "../mouser-engine-skia" }

# A mode plugin process end to end: the test binary runs itself as the plugin.
[[test]]
name = "stdio_mode"
harness = false
