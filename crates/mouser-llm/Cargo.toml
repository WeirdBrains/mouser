[package]
name = "mouser-llm"
description = "Mouser's built-in local model: llama.cpp (Vulkan/Metal) behind the local-llm feature"
version = "0.7.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mouser-core = { path = "../mouser-core" }
anyhow = "1"

# GPU backend: Vulkan on Linux/Windows, Metal on macOS (no CUDA/ROCm needed).
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["vulkan", "sampler"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal", "sampler"] }
