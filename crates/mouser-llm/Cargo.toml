[package]
name = "mouser-llm"
description = "Mouser's built-in local model: llama.cpp (Vulkan/Metal) behind the local-llm feature"
version = "1.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
mouser-core = { path = "../mouser-core" }
anyhow = "1"

# GPU backend: Vulkan on Linux, Metal on macOS (no CUDA/ROCm needed). Windows
# builds llama.cpp for the CPU, so the exe never needs vulkan-1.dll to start.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["vulkan", "sampler"] }

[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["sampler"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal", "sampler"] }
